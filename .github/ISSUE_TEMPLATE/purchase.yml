name: "Purchase: Keep License (12-month updates)"
description: "Purchase a Keep license + 12-month update window (licensed releases via private Release Vault repos)."
title: "[Purchase] Keep License (12-month updates)"
body:
  - type: markdown
    attributes:
      value: |
        **Do not post secrets** (API keys, DB passwords, private URLs) — this repo is public.

        This issue is the purchase intake. We will reply here with payment instructions.

        Commercial terms (authoritative): see `docs/commercial-contract.md`.
        Pricing: see `docs/pricing.md`.

  - type: dropdown
    id: license_type
    attributes:
      label: License type
      options:
        - "Organization (covers one company/org — unlimited devs, unlimited repos)"
        - "Individual (covers one person for their own projects)"
    validations:
      required: true

  - type: input
    id: licensee_name
    attributes:
      label: Licensee name
      description: "Org legal name (if Organization) or your name (if Individual)."
      placeholder: "Acme Inc. / Jane Doe"
    validations:
      required: true

  - type: input
    id: billing_email
    attributes:
      label: Billing email
      description: "We send the invoice/receipt here."
      placeholder: "billing@example.com"
    validations:
      required: true

  - type: input
    id: github_access
    attributes:
      label: GitHub access to grant (for Release Vaults)
      description: "GitHub username and/or GitHub org that should receive access to private Release Vault repos."
      placeholder: "github.com/<username> or github.com/<org>"
    validations:
      required: true

  - type: input
    id: github_org
    attributes:
      label: GitHub org name (Organization license only, optional)
      description: "If you want access granted to a GitHub org, put the org name here."
      placeholder: "acme-inc"
    validations:
      required: false

  - type: dropdown
    id: platforms
    attributes:
      label: Platform(s)
      description: "Select the platform(s) you plan to install on."
      multiple: true
      options:
        - "macOS (darwin-arm64)"
        - "Linux (x86_64)"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case (optional, 1–2 sentences)
      placeholder: "What are you building and where will Keep be used?"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: "Anything else we should know? (No secrets.)"
    validations:
      required: false
