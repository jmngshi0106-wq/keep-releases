name: Release Gate (Launch Spine)

on:
  release:
    types: [created, edited, published]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag pinned)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Gate release (assets + canonical blocks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 --version
          python3 .github/scripts/release_gate.py
