name: Release Gate (Launch Spine)

on:
  release:
    types: [created, edited, published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate release (assets + canonical blocks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 --version
          python3 .github/scripts/release_gate.py
